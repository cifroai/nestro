# Развёртывание на собственном сервере Заказчика (docs/DEPLOYMENT.md).
# Профили: dev — локальная разработка, prod — production, test — CI.

name: nestro

services:
  postgres:
    image: postgres:16-alpine
    profiles: [dev, prod]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestro}
      POSTGRES_USER: ${POSTGRES_USER:-nestro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      # Русская конфигурация полнотекстового поиска доступна из коробки.
      LANG: ru_RU.utf8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nestro} -d ${POSTGRES_DB:-nestro}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    profiles: [dev, prod]
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  minio:
    image: minio/minio:latest
    profiles: [prod]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nestro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  app:
    build:
      context: .
      target: app
    profiles: [dev, prod]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nestro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nestro}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET обязателен}
      INVITATION_SECRET: ${INVITATION_SECRET:?INVITATION_SECRET обязателен}
      APP_URL: ${APP_URL:?APP_URL обязателен}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETENTION_MONTHS: ${RETENTION_MONTHS:-24}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: .
      target: worker
    profiles: [dev, prod]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nestro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nestro}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      INVITATION_SECRET: ${INVITATION_SECRET}
      APP_URL: ${APP_URL}
      # Ключи LLM читаются только процессом worker (docs/SECURITY.md §9).
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_PRIMARY: ${LLM_MODEL_PRIMARY:-}
      LLM_MODEL_SECONDARY: ${LLM_MODEL_SECONDARY:-}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    profiles: [prod]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/proxy_params_nestro.conf:/etc/nginx/proxy_params_nestro.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    depends_on: [app]
    restart: unless-stopped
    networks: [internal]

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: nestro_test
      POSTGRES_USER: nestro
      POSTGRES_PASSWORD: nestro
    ports: ['5433:5432']
    tmpfs: ['/var/lib/postgresql/data']
    networks: [internal]

  redis-test:
    image: redis:7-alpine
    profiles: [test]
    ports: ['6380:6379']
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  internal:
    driver: bridge
