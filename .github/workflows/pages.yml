name: Deploy Mini App to GitHub Pages

# Публикует статику как Telegram Mini App.
# Разовая настройка: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches:
      - claude/telegram-mini-app-tasks-t6akf3
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
