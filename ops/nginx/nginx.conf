# Обратный прокси и завершение TLS (docs/DEPLOYMENT.md §1, docs/SECURITY.md §6).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 8m;

  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"request_id":"$request_id",'
    '"user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  # Ограничение частоты на уровне прокси дополняет прикладной rate limit.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

  upstream app_upstream {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    # Весь трафик переводится на HTTPS.
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://app_upstream;
      include /etc/nginx/proxy_params_nestro.conf;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app_upstream;
      include /etc/nginx/proxy_params_nestro.conf;
    }

    location / {
      proxy_pass http://app_upstream;
      include /etc/nginx/proxy_params_nestro.conf;
    }
  }
}
